[build-system]
requires = ["setuptools>=78,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "approvalbridge"
version = "0.1.0"
description = "Local, evidence-linked pricing-approval reconciliation workbench"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
approvalbridge = "approvalbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
approvalbridge = ["static/*.html", "static/*.css", "static/*.js"]
